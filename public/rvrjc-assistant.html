<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RVRJC Assistant – R.V.R. &amp; J.C. College of Engineering</title>
<style>
  :root{
    --navy:#0d2a5c;
    --navy-dark:#091f45;
    --orange:#e2761b;
    --pale:#e8f0fb;
    --border:#e3e7ee;
    --gray:#6b7280;
    --bg:#f6f8fb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:#111827;-webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:960px;margin:0 auto;background:#fff;min-height:100vh}
  .pad{padding:16px 16px 110px}

  /* ===== HEADER ===== */
  header.site{background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;position:relative;z-index:30}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
  .crest{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--border);background:var(--pale);flex:0 0 auto}
  .brand .n1{font-weight:800;color:var(--navy);font-size:16px;line-height:1.1}
  .brand .n2{font-weight:800;color:var(--navy);font-size:11px;letter-spacing:.04em;line-height:1.3}
  .brand .n3{color:var(--orange);font-size:10px;font-weight:700}
  .burger{background:none;border:0;padding:8px;color:var(--navy)}
  .hdrlink{display:none;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--navy);text-decoration:none;padding:8px 12px;border:1px solid var(--border);border-radius:999px;margin-left:auto;margin-right:8px}
  .hdrlink:hover{background:#f4f6fb}
  @media(min-width:560px){.hdrlink{display:inline-flex}}
  .mapwrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;aspect-ratio:16/10;max-height:420px}
  .mapwrap iframe{width:100%;height:100%;border:0;display:block}


  /* slide-out nav */
  .drawer{position:fixed;top:0;right:0;height:100%;width:264px;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .25s ease;z-index:60;padding:18px}
  .drawer.open{transform:translateX(0)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer h4{margin:0 0 12px;color:var(--navy);font-size:13px;letter-spacing:.08em}
  .drawer a{display:block;padding:12px 8px;border-radius:8px;color:#111827;text-decoration:none;font-weight:600;font-size:15px}
  .drawer a[data-active="true"]{background:var(--pale);color:var(--navy)}

  /* ===== HERO ===== */
  .hero img{width:100%;height:240px;object-fit:cover}

  /* ===== SECONDARY NAV ===== */
  .tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);background:#fff;padding:0 8px;scrollbar-width:none;position:sticky;top:0;z-index:20}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;background:none;border:0;padding:10px 12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--gray);font-size:11px;font-weight:600;border-bottom:3px solid transparent}
  .tab[data-active="true"]{color:var(--navy);border-bottom-color:var(--navy)}

  /* ===== SECTIONS ===== */
  h2.sec{font-size:18px;font-weight:800;margin:18px 0 12px;text-align:left}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:480px){.grid2{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:.15s}
  .card:hover{border-color:#c9d6ea;box-shadow:0 4px 14px rgba(13,42,92,.07)}
  .ico{width:36px;height:36px;border-radius:50%;background:var(--pale);color:var(--navy);display:flex;align-items:center;justify-content:center}
  .card .t{font-weight:700;font-size:14px}
  .card .d{color:var(--gray);font-size:12px;line-height:1.4}

  /* ===== ACTION BUTTONS ===== */
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
  .btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 15px;font-size:13px;font-weight:700;text-decoration:none}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{background:var(--navy-dark)}
  .btn-outline{background:#fff;color:var(--navy);border:1px solid #c9d6ea}
  .btn-outline:hover{background:var(--pale)}
  .btn-orange{background:var(--orange);color:#fff}
  .btn-orange:hover{filter:brightness(.94)}

  /* ===== CHAT ===== */
  .chat{display:flex;flex-direction:column;height:100%;background:#fff}
  .chat-head{background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;flex:0 0 auto}
  .chat-head .avatar{width:28px;height:28px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}
  .chat-head .title{font-weight:800;font-size:15px}
  .chat-head .online{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.85)}
  .chat-head .close{background:none;border:0;color:#fff;padding:4px;display:flex;margin-left:10px}
  .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
  .chat-body{padding:16px;flex:1;overflow-y:auto}
  .chat-body .hi{font-weight:800;font-size:16px}
  .chat-body .sub{font-size:14px;margin-top:2px}
  .chat-body .muted{color:var(--gray);font-size:12.5px;line-height:1.55;margin-top:6px}
  .qa-label{font-size:10.5px;color:var(--gray);letter-spacing:.14em;font-weight:700;margin:16px 0 8px}
  .pills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pill{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--navy);text-align:left}
  .pill:hover{background:var(--pale)}
  .log{margin-top:16px;display:flex;flex-direction:column;gap:10px;padding:4px}
  .log:empty{display:none}
  .msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:#f1f3f7;color:#111827;border-bottom-left-radius:4px}
  .msg.bot .src{display:inline-flex;align-items:center;gap:6px;margin-top:9px;background:#fff;border:1px solid var(--border);color:var(--navy);font-weight:700;font-size:12px;border-radius:8px;padding:7px 10px;text-decoration:none}
  .typing{align-self:flex-start;background:#f1f3f7;border-radius:14px;padding:12px 14px;display:flex;gap:5px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#9aa3b2;animation:bounce 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
  .composer{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--border);flex:0 0 auto;background:#fff}
  .field{flex:1;display:flex;align-items:center;gap:8px;background:#f6f8fb;border:1px solid var(--border);border-radius:999px;padding:8px 14px}
  .field input{flex:1;border:0;background:transparent;outline:none;font-size:14px;min-width:0}
  .mic{background:none;border:0;color:var(--gray);padding:2px;display:flex}
  .send{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;border:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .send:hover{background:var(--navy-dark)}
  .chat-foot{text-align:center;font-size:11px;color:var(--gray);padding:9px;border-top:1px solid var(--border);background:#fbfcfe;flex:0 0 auto}
  .chat-foot a{color:var(--navy);font-weight:700;text-decoration:none}
  .chat-foot a:hover{text-decoration:underline}

  /* ===== GLOBAL FLOATING CHAT BUTTON + PANEL ===== */
  .fab{position:fixed;right:18px;bottom:18px;width:64px;height:64px;border-radius:50%;border:0;background:#fff;box-shadow:0 10px 26px rgba(13,42,92,.28);display:flex;align-items:center;justify-content:center;padding:6px;z-index:80}
  .fab img{width:100%;height:100%;object-fit:contain}
  .fab::after{content:"";position:absolute;right:6px;top:6px;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid #fff}
  .fab:hover{transform:translateY(-2px);transition:.15s}
  .fab-label{position:fixed;right:92px;bottom:36px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:7px 11px;border-radius:8px;z-index:80;box-shadow:0 6px 18px rgba(13,42,92,.22)}
  @media (max-width:560px){.fab-label{display:none}}

  .chat-scrim{position:fixed;inset:0;background:rgba(9,31,69,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
  .chat-scrim.open{opacity:1;pointer-events:auto}
  .chat-panel{
    position:fixed;z-index:95;right:18px;bottom:18px;
    width:min(75vw,760px);height:75vh;max-height:75vh;
    background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:0 24px 60px rgba(9,31,69,.35);
    display:flex;flex-direction:column;
    transform:translateY(16px) scale(.98);opacity:0;pointer-events:none;transition:.2s ease;
  }
  .chat-panel.open{transform:none;opacity:1;pointer-events:auto}
  @media (max-width:700px){
    .chat-panel{right:8px;left:8px;bottom:8px;width:auto;height:75vh;max-height:75vh}
  }


  /* ===== QUESTION ROWS ===== */
  .qrow{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:9px;text-align:left}
  .qrow:hover{border-color:#c9d6ea}
  .qrow .q{flex:1;font-size:13.5px;font-weight:600}
  .qmark{width:30px;height:30px;border-radius:50%;background:var(--pale);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto}
  .chev{color:#9aa3b2;flex:0 0 auto}
  .lead{color:var(--gray);font-size:13.5px;line-height:1.6;margin:0 0 4px}
  .block{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0}
  .block-t{margin:0 0 10px;font-size:14px;font-weight:800;color:var(--navy)}
  .rows{margin:0}
  .row{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-top:1px solid #f0f2f6}
  .row:first-child{border-top:0;padding-top:0}
  .row dt{font-size:12.5px;font-weight:700}
  .row dd{margin:0;font-size:12.5px;color:var(--gray);line-height:1.5;word-break:break-word}
  @media (min-width:640px){.row{flex-direction:row}.row dt{flex:0 0 42%}.row dd{flex:1}}
  .srcbtn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--pale);color:var(--navy);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700;text-decoration:none}
  .srcbtn:hover{background:#dbe7f8}

  /* ===== APPLICATION FORM ===== */
  .form{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.fgrid{grid-template-columns:1fr}}
  .f{display:flex;flex-direction:column;gap:5px}
  .f label{font-size:12px;font-weight:700;color:var(--navy)}
  .f input,.f select,.f textarea{border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:inherit;background:#fbfcfe;outline:none}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:#9db8e0;background:#fff}
  .f.full{grid-column:1 / -1}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:560px){.checks{grid-template-columns:1fr}}
  .chk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:#111827;background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:8px 10px;cursor:pointer}
  .chk input{margin-top:2px;accent-color:var(--navy)}
  .note{font-size:11.5px;color:var(--gray);line-height:1.55;margin-top:12px}

  .ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:12px;font-size:12.5px;line-height:1.55;margin-top:12px}

  footer.site{padding:22px 16px 40px;text-align:center;color:var(--gray);font-size:11.5px;line-height:1.6}
  footer.site a{color:var(--navy);font-weight:700;text-decoration:none}
  footer.site a:hover{text-decoration:underline}
</style>
</head>

<div class="wrap">

  <!-- ===== HEADER ===== -->
  <header class="site">
    <a class="brand" href="https://rvrjcce.ac.in" target="_blank" rel="noopener">
      <img class="crest" src="/__l5e/assets-v1/beb7034b-4f08-4229-bc4e-fce69dcf52c9/rvrjc-crest.png" alt="R.V.R. &amp; J.C. College of Engineering crest" />

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>

      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

  </header>

  <!-- ===== HERO ===== -->
  <div class="hero">
    <img src="/__l5e/assets-v1/cf9fa55c-31ea-4125-b230-c8baa9743f5b/rvrjc-campus.jpeg" alt="R.V.R. &amp; J.C. College of Engineering main building" />
  </div>

  <!-- ===== SECONDARY NAV ===== -->
  <nav class="tabs" id="tabs"></nav>

  <main class="pad">

</aside>

<!-- ===== GLOBAL ASSISTANT (available on every page) ===== -->
<div class="chat-scrim" id="chatScrim"></div>
<div class="chat-panel" id="chatPanel" role="dialog" aria-label="RVRJC Assistant"></div>
<span class="fab-label" id="fabLabel">Ask the RVRJC Assistant</span>
<button class="fab" id="fab" aria-label="Open the RVRJC Assistant">
  <img src="/rasa-assistant.png" alt="RASA AI Assistant" />
</button>

<script>
/* ============================================================
   ICONS
   ============================================================ */
const svg = (d, extra = "") =>
  `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}${extra}</svg>`;

const I = {
  home: svg('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/>'),
  cap: svg('<path d="M22 9 12 4 2 9l10 5 10-5Z"/><path d="M6 11.5V17c0 1.5 3 3 6 3s6-1.5 6-3v-5.5"/>'),
  calendar: svg('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>'),
  people: svg('<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 5.5a3 3 0 0 1 0 5.8M18 20a6 6 0 0 0-2-4.4"/>'),
  building: svg('<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M10 21v-4h4v4"/>'),
  more: svg('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'),
  results: svg('<path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M9 13l2 2 4-4"/>'),
  briefcase: svg('<rect x="2.5" y="7" width="19" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>'),
  rupee: svg('<path d="M7 4h10M7 9h10M16 4c0 5-4 5-9 5l8 10"/>'),
  bell: svg('<path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/>'),
  shield: svg('<path d="M12 3l7.5 3v6c0 4.5-3 7.6-7.5 9-4.5-1.4-7.5-4.5-7.5-9V6L12 3Z"/><path d="M12 9v6M9 12h6"/>'),
  chev: svg('<path d="m9 6 6 6-6 6"/>'),
  qmarkTab: svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/>'),
  edit: svg('<path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M13.5 6.5l3 3"/>'),
  mic: svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 12a6.5 6.5 0 0 0 13 0M12 18.5V22"/>'),
  send: svg('<path d="M4 12l16-8-6.5 16-2.5-6.5L4 12Z"/>'),
  link: svg('<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>'),
  external: svg('<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
  close: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
};

/* ============================================================
   DATA
   ============================================================ */
const OFFICIAL_SITE = "https://rvrjcce.ac.in";

const TOPICS = [
  { icon: I.calendar, title: "Academic Calendar", desc: "View academic schedules and important dates." },
  { icon: I.people,   title: "Admission Process", desc: "Understand admissions and official links." },
  { icon: I.cap,      title: "Exam Time Table",   desc: "Find examination schedules and notices." },
  { icon: I.building, title: "Departments",       desc: "Explore departments and academic programmes." },
  { icon: I.results,  title: "Results",           desc: "Check published examination results." },
  { icon: I.briefcase,title: "Placements",        desc: "Placement cell and career support." },
  { icon: I.rupee,    title: "Fees",              desc: "Fee information and official payment page." },
  { icon: I.bell,     title: "Notices",           desc: "Latest official notices and circulars." },
];

/* Every question here is answered by the assistant from a verified official
   RVRJC page — see the KB chunks in src/lib/rvrjc-kb.ts. */
const COMMON_QUESTIONS = [
  "Where can I find the academic calendar?",
  "How do I pay 2nd year fees?",
  "When is the next exam timetable released?",
  "How do I apply for a bonafide certificate?",
  "What is the B.Tech tuition fee per year?",
  "How are admissions done under Category-B?",
  "Where do I check my semester results?",
  "How much is the hostel and bus fee?",
  "How do I apply for a Category-B management quota seat?",
  "How does lateral entry admission through AP ECET work?",
  "How do I pay the examination fee online?",
  "Which branches and departments does RVRJC offer?",
  "What is the Category-B tuition fee for CSE and AI branches?",
  "How do placements work and who do I contact?",
  "Where do I download course material on Moodle?",
  "How do I file a grievance or report ragging?",
  "What are the R24 regulations and attendance rules?",
  "Where is the college located and how do I contact it?",
  "Am I eligible for a scholarship or fee reimbursement?",
  "Where are the latest notices and circulars published?",
  "Where do I download the scheme and syllabus for my branch?",
  "What is the syllabus schedule and when are the mid exams?",
  "What are the hostel rules and facilities?",
  "How do I apply for a hostel seat and pay the hostel fee?",
  "What are the central library hours and how many books can I borrow?",
];

const ROUTES = [
  { id: "home",         label: "Home",         icon: I.home },
  { id: "academics",    label: "Academics",    icon: I.cap },
  { id: "syllabus",     label: "Syllabus",     icon: I.cap },
  { id: "examinations", label: "Examinations", icon: I.calendar },
  { id: "admissions",   label: "Admissions",   icon: I.people },
  { id: "apply",        label: "Apply",        icon: I.edit },
  { id: "hostel",       label: "Hostel",       icon: I.building },

/* ============================================================
   GLOBAL CHAT — created ONCE, lives outside the routed views,
   so it is available on every page and never loses its history.
   ============================================================ */
const API_URL = "/api/public/ask";

const chat = (() => {
  const panel = document.getElementById("chatPanel");
  const scrim = document.getElementById("chatScrim");
  const fab = document.getElementById("fab");
  const fabLabel = document.getElementById("fabLabel");

  const el = document.createElement("div");
  el.className = "chat";
  el.innerHTML = `
    <div class="chat-head">
      <img class="avatar" src="/rasa-assistant.png" alt="" />
      <span class="title">RVRJC Assistant</span>
      <span class="online"><span class="dot"></span>Online</span>
      <button class="close" id="chatClose" aria-label="Close assistant">${I.close}</button>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="hi">Namaste! 🙏</div>
      <div class="sub">I'm your RVRJC Assistant.</div>
      <div class="muted">Ask me anything about admissions, academics, examinations, placements, departments, facilities and more. Every answer is linked to an official RVRJC source — and I can also help with general questions.</div>
      <div class="qa-label">QUICK ACTIONS</div>
      <div class="pills">
        ${TOPICS.map(t => `<button class="pill" data-ask="${t.title}">${t.icon}<span>${t.title}</span></button>`).join("")}
      </div>
      <div class="log" id="log"></div>
    </div>
    <div class="composer">
      <div class="field">
        <input id="qInput" type="text" placeholder="Type your question..." autocomplete="off" />
        <button class="mic" aria-label="Voice input (demo)">${I.mic}</button>
      </div>
      <button class="send" id="sendBtn" aria-label="Send">${I.send}</button>
    </div>
    <div class="chat-foot">
      Powered by RASA AI Assistant ·
      <a href="https://rvrjcce.ac.in" target="_blank" rel="noopener">Official RVRJC website</a>
    </div>
  `;
  panel.appendChild(el);

  const body = el.querySelector("#chatBody");
  const log = el.querySelector("#log");
  const input = el.querySelector("#qInput");
  let busy = false;
  /* Conversation memory so the assistant keeps context like "CSE 2.1" across turns. */
  const turns = [];

  const scrollLog = () => { body.scrollTop = body.scrollHeight; };

  function open() {
    panel.classList.add("open");
    scrim.classList.add("open");
    fabLabel.style.display = "none";
    setTimeout(() => input.focus(), 180);
    scrollLog();
  }
  function close() {
    panel.classList.remove("open");
    scrim.classList.remove("open");
    fabLabel.style.display = "";
  }

  fab.addEventListener("click", () => (panel.classList.contains("open") ? close() : open()));
  scrim.addEventListener("click", close);
  el.querySelector("#chatClose").addEventListener("click", close);
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

  function push(role, text, sourceUrl, sourceLabel) {
    const b = document.createElement("div");
    b.className = "msg " + role;
    b.textContent = text;
    if (role === "bot") {
      // Always link to the REAL official page the answer came from.
      const a = document.createElement("a");
      a.className = "src";
      a.href = sourceUrl || OFFICIAL_SITE;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = `${sourceLabel || "Official RVRJC website"} ${I.link}`;
      b.appendChild(document.createElement("br"));
      b.appendChild(a);
    }
    log.appendChild(b);
    scrollLog();
  }

  function typing(on) {
    let t = log.querySelector(".typing");
    if (on && !t) {
      t = document.createElement("div");
      t.className = "typing";
      t.innerHTML = "<i></i><i></i><i></i>";
      log.appendChild(t);
      scrollLog();
    } else if (!on && t) t.remove();
  }

  async function ask(question) {
    const q = (question || "").trim();
    if (!q || busy) return;
    busy = true;
    input.value = "";
    push("user", q);
    turns.push({ role: "user", text: q });
    typing(true);
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, history: turns.slice(-8) }),
      });
      const data = await res.json().catch(() => null);
      typing(false);
      if (!res.ok) {
        push("bot", (data && data.error) || ("The assistant couldn't answer that (HTTP " + res.status + "). Please try again."));
      } else {
        const text = data.answer || "No answer returned.";
        turns.push({ role: "bot", text: text });
        push("bot", text, data.sourceUrl, data.sourceLabel);
      }
    } catch (err) {
      typing(false);
      push("bot", "I couldn't reach the assistant service just now. Please check your connection and try again.");
    } finally {
      busy = false;
      scrollLog();
    }
  }

  el.querySelectorAll("[data-ask]").forEach(b =>
    b.addEventListener("click", () => ask(b.dataset.ask))
  );
  el.querySelector("#sendBtn").addEventListener("click", () => ask(input.value));
  input.addEventListener("keydown", e => { if (e.key === "Enter") ask(input.value); });

  return {
    ask(q) { open(); ask(q); },
    open,
  };
})();
